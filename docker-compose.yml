services:

  postgres:
    image: postgres:16
    container_name: ride-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ride-network


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ride-pgadmin

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5050:80"

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ridematching.com
      PGADMIN_DEFAULT_PASSWORD: admin

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - ride-network


  redis:
    image: redis:7-alpine
    container_name: ride-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ride-network


  redis-insight:
    image: redis/redisinsight:latest
    container_name: ride-redis-insight

    restart: unless-stopped

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "5540:5540"

    volumes:
      - redis_insight_data:/data

    networks:
      - ride-network


  kafka:
    image: confluentinc/cp-kafka:8.1.0
    container_name: ride-kafka

    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093"

      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://ride-kafka:29092"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@ride-kafka:9093"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

    networks:
      - ride-network


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ride-kafka-ui

    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: ride-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ride-kafka:29092

    networks:
      - ride-network


volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redis_insight_data:
  kafka_data:


networks:
  ride-network:
    driver: bridge